services:
  - type: web
    name: vera-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn bot.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: nvidia
      - key: LLM_MODEL
        value: meta/llama-3.2-3b-instruct
      - key: LLM_API_KEY
        sync: false
      - key: TEAM_NAME
        value: Team Vera
      - key: BOT_VERSION
        value: 1.0.0
